<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 回调 | 刘春松</title>
  <meta name="description" content="纯前端 GitHub PKCE 登录回调页，用于处理 code、state、token 和用户信息。">
  <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
  <div id="ie-tip-anchor"></div>

  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="./index.html">
        <span class="brand-mark"></span>
        <span class="brand-text">
          <strong>Liu Chunsong</strong>
          <em>OAuth Callback</em>
        </span>
      </a>

      <button class="nav-toggle" type="button" aria-label="切换导航">
        <span></span>
        <span></span>
      </button>

      <nav class="nav">
        <a href="./index.html">首页</a>
        <a href="./about.html">关于</a>
        <a href="./works.html">作品</a>
        <a href="./links.html">链接</a>
        <a href="./navigation.html">导航</a>
        <a href="./contact.html">联系</a>
        <a href="./archive.html">归档</a>
        <a href="./guestbook.html">留言板</a>
      </nav>
    </header>

    <main>
      <section class="page-hero">
        <div class="page-hero-copy" data-reveal>
          <p class="eyebrow">OAuth Callback</p>
          <h1>GitHub 登录处理中</h1>
          <p>这个页面负责校验 `state`、交换 `access_token`、拉取 GitHub 用户信息，然后自动跳回留言板。</p>
          <div class="hero-actions">
            <a class="btn btn-secondary" href="./guestbook.html">返回留言板</a>
          </div>
        </div>

        <div class="page-hero-panel info-card" data-reveal>
          <span class="card-tag">Callback Status</span>
          <h2 id="callback-status">等待 GitHub 回调...</h2>
          <p id="callback-detail">准备读取 `code` 与 `state` 参数。</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>GitHub callback page handles PKCE code exchange and user profile loading.</p>
    </footer>
  </div>

  <script src="./static/js/jquery.min.js"></script>
  <script src="./static/js/main.js"></script>
  <script src="./static/js/github-config.js"></script>
  <script type="module" src="./static/js/github-callback.js"></script>
